<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Employee Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>EmpManager</h1>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active">
                    <i class="fas fa-home"></i>&nbsp; Dashboard
                </a>
                <a href="#" class="menu-item">
                    <i class="fas fa-users"></i>&nbsp; Employees
                </a>
                <a href="#" class="menu-item">
                    <i class="fas fa-building"></i>&nbsp; Departments
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="navbar">
                <div class="page-title">
                    <h2>Dashboard Overview</h2>
                </div>
                <div class="user-info">
                    <span id="admin-name">Admin Name</span>
                    <button id="logout-btn" class="logout-btn">Logout</button>
                </div>
            </header>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Employees</h3>
                    <div class="value" id="total-employees">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Departments</h3>
                    <div class="value" id="total-departments">0</div>
                </div>
                <div class="stat-card">
                    <h3>HR Dept Count</h3>
                    <div class="value" id="hr-count">0</div>
                </div>
            </div>

            <!-- Table Area -->
            <div class="table-container">
                <div class="table-header">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-input" placeholder="Search employees by name...">
                    </div>
                    <button class="btn" style="width: auto;" id="add-employee-btn">
                        <i class="fas fa-plus"></i> Add Employee
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Joining Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Add/Edit Employee Modal -->
    <div id="employee-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Employee</h2>
                <span class="close-modal" id="close-modal">&times;</span>
            </div>
            <form id="employee-form">
                <input type="hidden" id="employee-id">
                <div class="form-group">
                    <label for="emp-name">Full Name</label>
                    <input type="text" id="emp-name" required>
                </div>
                <div class="form-group">
                    <label for="emp-email">Email</label>
                    <input type="email" id="emp-email" required>
                </div>
                <div class="form-group">
                    <label for="emp-dept">Department</label>
                    <select id="emp-dept" required>
                        <!-- Options will be loaded here -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="emp-salary">Salary</label>
                    <input type="number" id="emp-salary" required>
                </div>
                <div class="form-group">
                    <label for="emp-date">Joining Date</label>
                    <input type="date" id="emp-date" required>
                </div>
                <button type="submit" class="btn" id="save-employee-btn">Save Employee</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
